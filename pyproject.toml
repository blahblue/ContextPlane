[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextplane"
version = "0.1.0"
description = "Vendor-neutral runtime for governed organizational context for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "ContextPlane contributors" }]
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "mcp>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pyyaml>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
contextplane-mcp = "contextplane.mcp.server:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "httpx2>=2.5,<3.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contextplane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: tests requiring external infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["contextplane"]

[tool.coverage.run]
source = ["contextplane"]

[tool.coverage.report]
show_missing = true
fail_under = 90

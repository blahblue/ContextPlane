name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CONTEXTPLANE_DATABASE_URL: postgresql+psycopg://contextplane:contextplane_test@localhost:5432/contextplane_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contextplane_test
          POSTGRES_USER: contextplane
          POSTGRES_PASSWORD: contextplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextplane -d contextplane_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test
        run: pytest --cov=contextplane --cov-report=term-missing

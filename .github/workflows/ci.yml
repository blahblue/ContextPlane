name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CONTEXTPLANE_DATABASE_URL: postgresql+psycopg://contextplane:contextplane_test@localhost:5432/contextplane_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contextplane_test
          POSTGRES_USER: contextplane
          POSTGRES_PASSWORD: contextplane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextplane -d contextplane_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Scan repository and Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test
        run: pytest --cov=contextplane --cov-report=term-missing

      - name: Run MVP evaluation
        run: python -m contextplane.evaluation

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CONTEXTPLANE_DB_NAME}
      POSTGRES_USER: ${CONTEXTPLANE_DB_USER}
      POSTGRES_PASSWORD: ${CONTEXTPLANE_DB_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CONTEXTPLANE_DB_USER} -d ${CONTEXTPLANE_DB_NAME}",
        ]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - contextplane-postgres:/var/lib/postgresql/data

  contextplane:
    build:
      context: .
    environment:
      CONTEXTPLANE_DATABASE_URL: >-
        postgresql+psycopg://${CONTEXTPLANE_DB_USER}:${CONTEXTPLANE_DB_PASSWORD}@postgres:5432/${CONTEXTPLANE_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  contextplane-postgres:

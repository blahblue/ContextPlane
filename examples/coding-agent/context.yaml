items:
  - key: engineering.testing.required
    value:
      framework: pytest
      requirement: "Add or update automated tests for behavior changes."
    domain: engineering
    scope:
      tenant_id: coding-demo-org
      environment: production
    owner: platform-engineering
    source:
      type: manual
      identifier: coding-demo-shared-testing
    authority_level: standard
    effective_from: "2026-10-01T00:00:00Z"
